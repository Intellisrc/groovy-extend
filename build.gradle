import org.gradle.api.tasks.*
import org.gradle.api.file.*

plugins {
    id 'groovy'
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

// Load local overrides
def localPropsFile = file('gradle-local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { stream ->
        Properties props = new Properties()
        props.load(stream)
        props.each { key, value ->
            project.ext.set(key.toString(), value)
        }
    }
}

final int javaVersion = 21

def groovyVer = '5.0.8'
def libVersion = '15'

group = groupName
version = "${groovyVer}.${libVersion}"
boolean isDev = version.contains("SNAPSHOT")
boolean publishDev = ! version.contains("DEBUG")

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}
configurations {
    documentation
}
dependencies {
    // Use the latest Groovy version for building this library
    compileOnly "org.apache.groovy:groovy:${groovyVer}"

    // Use the awesome Spock testing and specification framework even with Java
    testImplementation 'org.spockframework:spock-core:2.4-groovy-5.0'
    // Fixes "The automatic loading of test framework implementation dependencies has been deprecated." for Gradle 9
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java {
    if(!isDev || publishDev) {
        withJavadocJar()
        withSourcesJar()
    }
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}
nexusPublishing {
    repositories {
        sonatype {
            // see https://central.sonatype.org/publish/publish-portal-ossrh-staging-api/#configuration
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
        }
    }
}
publishing {
    publications {
        register("mavenJava", MavenPublication) {
            from(components["java"] as SoftwareComponent)

            assert groupName : "groupName is required"
            assert artifact : "artifact is required"
            groupId = groupName
            artifactId = artifact

            //version = version
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }

            pom {
                name = projectName
                description = projectDescription
                url = projectURL
                inceptionYear = projectSince
                packaging = 'jar'
                licenses {
                    license {
                        name = 'GNU General Public License v3.0'
                        url = 'https://www.gnu.org/licenses/gpl-3.0.en.html'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = authorId
                        name = authorName
                        email = authorEmail
                    }
                }
                scm {
                    url = projectURL
                    connection = "scm:git:${projectURL}.git"
                    developerConnection = "scm:git:${projectDevURL}"
                }
            }
        }
    }
}
signing {
    //If we remove "artifacts" and set this one, it generates the jar, but without generateModule()
    if(! isDev || publishDev) {
        sign publishing.publications.mavenJava
    }
}

@CacheableTask
abstract class GenerateGroovyExtensionModule extends DefaultTask {

    @InputFiles
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getGroovySources()

    @Input
    abstract Property<String> getModuleName()

    @Input
    abstract Property<String> getModuleVersion()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void generate() {
        List<String> extensionClasses = []
        List<String> staticExtensionClasses = []

        File srcRoot = project.file("src/main/groovy").canonicalFile

        groovySources.files.each { File g ->
            File canonical = g.canonicalFile
            assert canonical.path.startsWith(srcRoot.path)

            String relPath = srcRoot.toPath().relativize(canonical.toPath()).toString()

            String fqcn = relPath
                .replace(File.separatorChar.toString(), '.')
                .replaceAll(/\.groovy$/, '')

            if (fqcn.contains('Static')) {
                staticExtensionClasses << fqcn
            } else {
                extensionClasses << fqcn
            }
        }

        File servicesDir = outputDir.get().file("META-INF/services").asFile
        servicesDir.mkdirs()

        File moduleFile = new File(servicesDir, "org.codehaus.groovy.runtime.ExtensionModule")
        moduleFile.text = """\
moduleName=${moduleName.get()}
moduleVersion=${moduleVersion.get()}
extensionClasses=${extensionClasses.join(',')}
staticExtensionClasses=${staticExtensionClasses.join(',')}
"""
    }
}

tasks.register("generateModule", GenerateGroovyExtensionModule) {
    groovySources.from(
        sourceSets.main.allSource.matching { include("**/*.groovy") }
    )
    moduleName.set("groovy-common-extensions")
    moduleVersion.set(project.version.toString())
    outputDir.set(layout.buildDirectory.dir("generated/resources"))
}

ProjectLayout pl = project.layout
sourceSets {
    main {
        resources.srcDir(pl.buildDirectory.dir("generated/resources"))
    }
}
tasks.named("sourcesJar") {
    dependsOn(tasks.named("generateModule"))
}
tasks.named("processResources") {
    dependsOn(tasks.named("generateModule"))
}
tasks.withType(Groovydoc).configureEach {
    classpath += project.configurations.documentation
}
tasks.withType(JavaCompile).configureEach {
    options.release.set(javaVersion) // Ensures bytecode compatibility with Java
}
tasks.withType(Test).configureEach {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}