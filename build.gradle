plugins {
    id 'groovy'
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

// Load local overrides
def localPropsFile = file('gradle-local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { stream ->
        Properties props = new Properties()
        props.load(stream)
        props.each { key, value ->
            project.ext.set(key.toString(), value)
        }
    }
}

final int javaVersion = 21

def groovyVer = '4.0.30'
def libVersion = '14'

group = groupName
version = "${groovyVer}.${libVersion}"
boolean isDev = version.contains("SNAPSHOT")
boolean publishDev = ! version.contains("DEBUG")

dependencies {
    // Use the latest Groovy version for building this library
    compileOnly "org.apache.groovy:groovy:${groovyVer}"

    // Use the awesome Spock testing and specification framework even with Java
    testImplementation 'org.spockframework:spock-core:2.4-M4-groovy-4.0'
    // Fixes "The automatic loading of test framework implementation dependencies has been deprecated." for Gradle 9
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    if(!isDev || publishDev) {
        withJavadocJar()
        withSourcesJar()
    }
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}
nexusPublishing {
    repositories {
        sonatype {
            // see https://central.sonatype.org/publish/publish-portal-ossrh-staging-api/#configuration
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
        }
    }
}
publishing {
    publications {
        mavenJava(MavenPublication) {
            assert groupName : "groupName is required"
            assert artifact : "artifact is required"
            groupId = groupName
            artifactId = artifact

            from components.java

            //version = version
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }

            pom {
                name = projectName
                description = projectDescription
                url = projectURL
                inceptionYear = projectSince
                packaging = 'jar'
                licenses {
                    license {
                        name = 'GNU General Public License v3.0'
                        url = 'https://www.gnu.org/licenses/gpl-3.0.en.html'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = authorId
                        name = authorName
                        email = authorEmail
                    }
                }
                scm {
                    url = projectURL
                    connection = "scm:git:${projectURL}.git"
                    developerConnection = "scm:git:${projectDevURL}"
                }
            }
        }
    }
}
signing {
    //If we remove "artifacts" and set this one, it generates the jar, but without generateModule()
    if(! isDev || publishDev) {
        sign publishing.publications.mavenJava
    }
}

tasks.register('generateModule') {
    doLast {
        SourceSet main = sourceSets.main
        SourceDirectorySet groovy = main.groovy
        List<String> extensionFiles = []
        List<String> staticFiles = []
        groovy.toList().each {
            File g ->
                String pkg = g.absolutePath.replaceAll(File.separator, '.') -
                    groovy.srcDirs[0].toString().replaceAll(File.separator, '.')
                String clsName = pkg[1..pkg.lastIndexOf('.') - 1].toString()
                if (clsName.contains('Static')) {
                    staticFiles << clsName
                } else {
                    extensionFiles << clsName
                }
        }
        File services = new File(rootDir, "build/classes/groovy/main/META-INF/services")
        services.mkdirs()
        File ext = new File(services, 'org.codehaus.groovy.runtime.ExtensionModule')
        ext.text = """moduleName=groovy-common-extensions
moduleVersion=$version
extensionClasses=${extensionFiles.join(',')}
staticExtensionClasses=${staticFiles.join(',')}"""
    }
}
// Hook up dependencies
jar.dependsOn(generateModule)
javadoc {
    options.addBooleanOption('html5', true)
}
tasks.withType(Groovydoc).configureEach {
    classpath += project.configurations.documentation
}
tasks.withType(JavaCompile).configureEach {
    options.release.set(javaVersion) // Ensures bytecode compatibility with Java
}
tasks.withType(Test).configureEach {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}